# golangci-lint configuration for cool-kit
# https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m
  issues-exit-code: 1
  tests: true
  modules-download-mode: readonly

# output:
#   format: colored-line-number
#   print-issued-lines: true
#   print-linter-name: true
#   sort-results: true

linters:
  default: none

  enable:
    # Core correctness
    - govet
    - staticcheck
    - ineffassign
    - unused

  disable:
    - depguard

  # v2: Settings are under 'settings' key
  settings:
    staticcheck:
      checks:
        - all
        - -ST*

  # v2: Exclusions are here
  exclusions:
    rules:
      # Exclude some linters from running on tests files
      - path: "_test\\.go"
        linters:
          - staticcheck

      # Exclude known issues in generated files
      - path: ".*\\.gen\\.go"
        linters:
          - all

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
  new: false

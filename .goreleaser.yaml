# GoReleaser Configuration for cool-kit
# Comprehensive configuration with support for:
# - Multi-platform builds (Linux, macOS, Windows)
# - Package managers: Homebrew, AUR, Winget, Nix
# - Docker images with multi-arch manifests
# - SBOM generation and GPG signing
#
# Documentation: https://goreleaser.com

version: 2



project_name: cool-kit

# =============================================================================
# Environment
# =============================================================================
env:
  - GO111MODULE=on

# =============================================================================
# Before hooks
# =============================================================================
before:
  hooks:
    - go mod tidy
    - go mod verify

# =============================================================================
# Builds
# =============================================================================
builds:
  - id: cool-kit
    main: .
    binary: cool-kit
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    mod_timestamp: '{{ .CommitTimestamp }}'

# =============================================================================
# Universal binaries (macOS)
# =============================================================================
universal_binaries:
  - id: cool-kit-universal
    name_template: cool-kit
    replace: true

# =============================================================================
# Archives
# =============================================================================
archives:
  - id: default
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- if eq .Os "darwin" }}macOS
      {{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE*
      - README*
      - CHANGELOG*

# =============================================================================
# Checksums
# =============================================================================
checksum:
  name_template: checksums.txt
  algorithm: sha256

# =============================================================================
# Snapshots
# =============================================================================
snapshot:
  version_template: "{{ incpatch .Version }}-next"

# =============================================================================
# Changelog
# =============================================================================
changelog:
  use: github
  sort: asc
  abbrev: 7
  groups:
    - title: "🚀 Features"
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: "🐛 Bug Fixes"
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: "📚 Documentation"
      regexp: '^.*?docs?(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: "🔧 Performance & Refactors"
      regexp: '^.*?(perf|refactor)(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: "📦 Dependencies"
      regexp: '^.*?(build|deps?)(\([[:word:]]+\))??!?:.+$'
      order: 4
    - title: "Other Changes"
      order: 999
  filters:
    exclude:
      - '^chore:'
      - '^style:'
      - '^test:'
      - '^ci:'
      - Merge pull request
      - Merge branch
      - go mod tidy

# =============================================================================
# GitHub Release
# =============================================================================
release:
  github:
    owner: entro314-labs
    name: cool-kit
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## cool-kit {{ .Tag }}

    **Release Date**: {{ .Date }}

  footer: |
    ---

    ## Installation

    ### Homebrew
    ```bash
    brew install --cask entro314-labs/homebrew-tap/cool-kit
    ```

    ### Winget
    ```powershell
    winget install Entro314Labs.CoolKit
    ```

    ### AUR
    ```bash
    yay -S cool-kit-bin
    ```

    ### Go Install
    ```bash
    go install github.com/entro314-labs/cool-kit@{{ .Tag }}
    ```

    ### Docker
    ```bash
    docker pull ghcr.io/entro314-labs/cool-kit:{{ .Version }}
    ```

    ### Manual Installation
    Download the appropriate binary for your platform from the assets below.

    **Full Changelog**: https://github.com/entro314-labs/cool-kit/compare/{{ .PreviousTag }}...{{ .Tag }}

# =============================================================================
# Homebrew Tap (Formula & Casks)
# =============================================================================
homebrew_casks:
  - name: cool-kit
    ids:
      - default
    repository:
      owner: entro314-labs
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/entro314-labs/cool-kit
    description: "CLI toolkit for Coolify deployments"
    license: MIT
    skip_upload: "{{ .IsSnapshot }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Homebrew Cask update for {{ .ProjectName }} version {{ .Tag }}"

    # Casks use declarative binaries and completions, not Ruby install scripts
    binaries:
      - cool-kit

    # Define completions if you generate them in your build or have them in the repo
    # Assuming completions are generated/available
    # completions:
    #   bash: completions/cool-kit.bash
    #   zsh: completions/cool-kit.zsh
    #   fish: completions/cool-kit.fish

# =============================================================================
# Winget (Windows Package Manager)
# =============================================================================
winget:
  - name: cool-kit
    package_identifier: Entro314Labs.CoolKit
    publisher: Entro314 Labs
    short_description: "CLI toolkit for Coolify deployments"
    license: MIT
    license_url: "https://github.com/entro314-labs/cool-kit/blob/main/LICENSE"
    copyright: "Entro314 Labs"
    homepage: https://github.com/entro314-labs/cool-kit
    description: "CLI toolkit for Coolify deployments"
    skip_upload: "{{ .IsSnapshot }}"
    repository:
      owner: microsoft
      name: winget-pkgs
      branch: master
      token: "{{ .Env.WINGET_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com

# =============================================================================
# AUR (Arch User Repository)
# =============================================================================
aurs:
  - name: cool-kit-bin
    ids:
      - default
    homepage: https://github.com/entro314-labs/cool-kit
    description: "CLI toolkit for Coolify deployments"
    maintainers:
      - "entro314-labs"
    license: MIT
    disable: "{{ .IsSnapshot }}"
    skip_upload: "{{ .IsSnapshot }}"
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: "ssh://aur@aur.archlinux.org/cool-kit-bin.git"
    package: |-
      # bin
      install -Dm755 "./cool-kit" "${pkgdir}/usr/bin/cool-kit"
      # license
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/cool-kit/LICENSE"
      # completions
      # mkdir -p "${pkgdir}/usr/share/bash-completion/completions/"
      # mkdir -p "${pkgdir}/usr/share/zsh/site-functions/"
      # mkdir -p "${pkgdir}/usr/share/fish/vendor_completions.d/"
      # install -Dm644 "./completions/cool-kit.bash" "${pkgdir}/usr/share/bash-completion/completions/cool-kit"
      # install -Dm644 "./completions/cool-kit.zsh" "${pkgdir}/usr/share/zsh/site-functions/_cool-kit"
      # install -Dm644 "./completions/cool-kit.fish" "${pkgdir}/usr/share/fish/vendor_completions.d/cool-kit.fish"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com


# =============================================================================
# Linux packages (deb/rpm)
# =============================================================================
nfpms:
  - id: packages
    package_name: cool-kit
    file_name_template: "{{ .ConventionalFileName }}"
    homepage: https://github.com/entro314-labs/cool-kit
    description: "CLI toolkit for Coolify deployments"
    maintainer: "entro314-labs"
    license: MIT
    vendor: entro314-labs
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin

# =============================================================================
# Docker
# =============================================================================
dockers_v2:
  - ids:
      - cool-kit
    dockerfile: Dockerfile.goreleaser

    images:
      - "ghcr.io/entro314-labs/cool-kit"

    tags:
      - "{{ .Version }}"
      - "latest"
      - "{{ .Version }}-amd64"
      - "{{ .Version }}-arm64"

    platforms:
      - linux/amd64
      - linux/arm64

    # Skip Docker builds in snapshot mode - --load is incompatible with cross-arch builds
    # Production releases (with tags) will still build and push Docker images
    disable: "{{ .IsSnapshot }}"

    flags:
      - "--pull"

    labels:
      "org.opencontainers.image.created": "{{.Date}}"
      "org.opencontainers.image.title": "{{.ProjectName}}"
      "org.opencontainers.image.revision": "{{.FullCommit}}"
      "org.opencontainers.image.version": "{{.Version}}"
      "org.opencontainers.image.source": "https://github.com/entro314-labs/cool-kit"

# =============================================================================
# Docker Signing
# =============================================================================
docker_signs:
  - artifacts: all
    stdin: "{{ .Env.COSIGN_PWD }}"



# =============================================================================
# SBOM (Software Bill of Materials)
# =============================================================================
sboms:
  - id: archive
    artifacts: archive
    documents:
      - "${artifact}.spdx.json"
  - id: source
    artifacts: source
    documents:
      - "${artifact}.spdx.json"

# =============================================================================
# Artifact Signing
# =============================================================================
signs:
  - id: checksum-sign
    artifacts: checksum
    stdin: "{{ .Env.COSIGN_PWD }}"
  - id: artifacts-sign
    artifacts: all
    stdin: "{{ .Env.COSIGN_PWD }}"


# =============================================================================
# Source archive
# =============================================================================
source:
  enabled: true
  name_template: "{{ .ProjectName }}_{{ .Version }}_source"
  format: tar.gz

# =============================================================================
# Metadata
# =============================================================================
metadata:
  mod_timestamp: '{{ .CommitTimestamp }}'

# =============================================================================
# Announcements (optional)
# =============================================================================
announce:
  skip: "{{gt .Patch 0}}"  # Skip announcements for patch releases

# Release Workflow for cool-kit
# Triggers on version tags (v*.*.*) and creates GitHub releases

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.0.0)'
        required: false
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: |
          go mod download
          go mod verify
          go test -v ./...

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          # Name the builder 'goreleaser' so GoReleaser can use it
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 4
          # Install QEMU platforms
          platforms: linux/amd64,linux/arm64

      # Verify buildx is working and list builders
      - name: Verify buildx setup
        env:
          BUILDER_NAME: ${{ steps.buildx.outputs.name }}
        run: |
          docker buildx ls
          docker run --privileged --rm tonistiigi/binfmt --install all
          echo "BUILDER_NAME=${BUILDER_NAME}" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.24.4

     # - name: Install Cosign
    #  uses: sigstore/cosign-installer@v4.1.0


      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
        #  COSIGN_PWD: ${{ secrets.COSIGN_PWD }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: dist/*
          retention-days: 30

  verify:
    name: Verify Release
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Wait for release
        run: sleep 30

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          echo "Checking release for tag: $TAG"
          gh release view "$TAG" --repo "$REPO"

      - name: Test installation (Go)
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          go install "github.com/${REPO}@${TAG}"
          cool-kit --version

      - name: Test Docker image
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          docker pull "ghcr.io/${REPO}:${VERSION}"
          docker run --rm "ghcr.io/${REPO}:${VERSION}" --version
        continue-on-error: true
